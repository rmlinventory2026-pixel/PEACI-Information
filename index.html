<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACI Student Portal</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="PEACI.png">

    <!-- Import Poppins Font (Bold only as requested) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Color Palette extracted from the PEACI Logo */
        :root {
            --primary: #e60000; 
            --secondary: #00aa00; 
            --accent: #ffcc00; 
            --white: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 170, 0, 0.2); 
            --text-main: #1a1a1a;
        }

        /* Enforce Poppins Bold Globally */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            font-weight: 700; 
        }

        body {
            /* Added Red Gradient Overlay on top of the Desktop image */
            background-image: linear-gradient(rgba(230, 0, 0, 0.85), rgba(230, 0, 0, 0.85)), url('PEACI-desk.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: var(--primary); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Mobile Background Adjustment */
        @media (max-width: 768px) {
            body {
                /* Added Red Gradient Overlay on top of the Mobile image */
                background-image: linear-gradient(rgba(230, 0, 0, 0.85), rgba(230, 0, 0, 0.85)), url('PEACI-mob.png');
            }
        }

        /* --- Global Form Styles --- */
        .input-group {
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, 
        .input-group select {
            padding: 0.8rem 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background-color: var(--white);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            width: 100%; 
        }

        .input-group input:focus, 
        .input-group select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(0, 170, 0, 0.2);
        }

        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            display: flex;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--secondary);
        }

        .checkbox-group label {
            margin: 0;
            font-size: 0.9rem;
            color: var(--secondary);
            cursor: pointer;
        }

        .btn {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: var(--secondary);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* --- Views (Login & Redirect) --- */
        #login-view, #redirect-view {
            display: flex;
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
        }

        #redirect-view {
            display: none; /* Hidden by default */
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 450px;
            padding: 3rem 2.5rem;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border-top: 8px solid var(--accent);
            margin: auto;
            animation: fadeIn 0.4s ease-out;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header img {
            width: 120px;
            height: auto;
            margin-bottom: 1rem;
        }

        .login-header h1 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.2rem;
        }

        .login-header p {
            font-size: 0.95rem;
            color: var(--secondary);
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 80px;
            gap: 1rem;
        }

        .redirect-message {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        .spinner {
            margin: 1.5rem auto;
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        /* Footer Settings */
        .site-footer {
            text-align: center;
            padding: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-top: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ================= LOGIN SECTION ================= -->
    <div id="login-view">
        <div class="login-card">
            <div class="login-header">
                <!-- Logo -->
                <img src="PEACI-LOGO.png" alt="PEACI Logo">
                <h1>STUDENT PORTAL</h1>
                <p>Welcome to the Student Information System</p>
            </div>
            
            <form id="login-form">
                <!-- First Name on its own row -->
                <div class="input-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Juan" required>
                </div>
                
                <!-- Last Name & M.I. share a row perfectly -->
                <div class="name-row">
                    <div class="input-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Dela Cruz" required>
                    </div>
                    <div class="input-group">
                        <label for="middleInit">M.I.</label>
                        <input type="text" id="middleInit" placeholder="A" maxlength="1" required>
                    </div>
                </div>

                <!-- Course Selection Dropdown -->
                <div class="input-group">
                    <label for="courseSelection">Course</label>
                    <select id="courseSelection" required>
                        <option value="" disabled selected>Select your course</option>
                        <option value="BS Accountancy">BS Accountancy</option>
                        <option value="BS Civil Engineering">BS Civil Engineering</option>
                        <option value="Criminology">Criminology</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Social Work">Social Work</option>
                        <option value="Education">Education</option>
                        <option value="Nursing">Nursing</option>
                    </select>
                </div>

                <!-- ID Number -->
                <div class="input-group">
                    <label for="studentId">ID Number</label>
                    <input type="text" id="studentId" placeholder="2026-00123" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">REMEMBER LOGIN</label>
                </div>

                <button type="submit" class="btn">LOG IN</button>
            </form>
        </div>
    </div>

    <!-- ================= REDIRECTING SECTION ================= -->
    <div id="redirect-view">
        <div class="login-card">
            <div class="login-header">
                <h1>Redirecting...</h1>
            </div>
            <div class="spinner"></div>
            <p class="redirect-message">
                Directing to CITE Information.<br><br>
                If there's any problem, please visit the ICT Coordinator in Admin Office during work hours.
            </p>
        </div>
    </div>

    <!-- Requested Footer -->
    <footer class="site-footer">
        Processed by PEACI-ICT
    </footer>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        const loginForm = document.getElementById('login-form');

        // Check if user is already logged in (Check both local and session storage)
        function initApp() {
            const savedLocal = localStorage.getItem('citeStudentData');
            const savedSession = sessionStorage.getItem('citeStudentData');
            
            // If data exists, bypass login and redirect to CITE.html
            if (savedLocal || savedSession) {
                window.location.href = "CITE.html";
            }
        }

        // Handle Login Form
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const middleInit = document.getElementById('middleInit').value.trim().toUpperCase();
            const studentId = document.getElementById('studentId').value.trim();
            const courseSelection = document.getElementById('courseSelection').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            const studentData = {
                firstName,
                lastName,
                middleInit,
                studentId,
                courseSelection,
                fullName: `${firstName} ${middleInit}. ${lastName}`
            };

            // Save based on "Remember Login" preference so CITE.html can access it later
            if (rememberMe) {
                localStorage.setItem('citeStudentData', JSON.stringify(studentData));
            } else {
                sessionStorage.setItem('citeStudentData', JSON.stringify(studentData));
            }
            
            // UI Transition: Hide login form and show the redirecting message
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('redirect-view').style.display = 'flex';

            // Wait 5 seconds (5000ms), then direct to CITE.html
            setTimeout(() => {
                window.location.href = "CITE.html";
            }, 5000);
        });

        // Initialize App on load
        initApp();
    </script>
</body>
</html>
